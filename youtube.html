<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente YouTube · Uniproveedores</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a16;color:#e0d8cc;min-height:100vh;}
.header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,0,0,0.18);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.back{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.back-ic{width:32px;height:32px;border-radius:8px;background:rgba(255,0,0,0.15);display:flex;align-items:center;justify-content:center;color:#ff4444;font-size:18px;}
.b-title{font-size:15px;font-weight:700;color:#ff4444;}
.b-sub{font-size:9px;color:#666;letter-spacing:2px;text-transform:uppercase;}
.ia-badge{font-size:11px;color:#ff4444;background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.2);padding:4px 10px;border-radius:20px;}
.main{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
.tip{background:rgba(255,0,0,0.06);border:1px solid rgba(255,0,0,0.15);border-radius:10px;padding:11px 16px;font-size:12px;color:#ff9a9a;margin-bottom:16px;}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:12px;}
.sec-lbl{font-size:10px;color:#ff4444;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:10px;}
.field{margin-bottom:11px;}.field:last-child{margin-bottom:0;}
.field label{font-size:11px;color:#888;display:block;margin-bottom:5px;}
input,textarea,select{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:9px 12px;color:#e0d8cc;font-size:13px;font-family:inherit;}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(255,0,0,0.5);}
textarea{resize:vertical;min-height:60px;}
.btn-main{width:100%;background:linear-gradient(135deg,#ff2d2d,#c40000);border:none;border-radius:10px;padding:14px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;}
.btn-main:hover{opacity:0.9;}.btn-main:disabled{background:rgba(100,100,100,0.2);color:#555;cursor:not-allowed;}
.result-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,0,0,0.2);border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #ff4444;animation:fadeIn 0.35s ease;}
.result-title{font-size:13px;font-weight:700;color:#ff6b6b;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.result-body{background:rgba(0,0,0,0.25);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:#d0c8b8;white-space:pre-wrap;}
.btn-sm{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11px;color:#aaa;font-family:inherit;}
.btn-sm:hover{background:rgba(255,255,255,0.12);}.btn-sm.ok{background:rgba(0,200,100,0.1);border-color:rgba(0,200,100,0.3);color:#00c864;}
.title-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,0.25);border-radius:8px;margin-bottom:6px;font-size:13px;color:#d0c8b8;}
.title-opt:last-child{margin-bottom:0;}
.title-opt .cc{font-size:10px;color:#666;margin-left:auto;white-space:nowrap;}
.empty{text-align:center;padding:30px 20px;color:#444;}
.loading{text-align:center;padding:30px 20px;color:#ff6b6b;font-size:13px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.15);border-top-color:#ff4444;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
.steps{font-size:11px;color:#888;line-height:1.7;}
.steps b{color:#ff9a9a;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
#notif{position:fixed;top:16px;right:16px;z-index:9999;background:rgba(10,10,22,0.97);border:1px solid rgba(255,0,0,0.45);border-radius:10px;padding:11px 16px;font-size:13px;color:#ff6b6b;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div id="notif"></div>
<div class="header">
  <a class="back" href="/"><div class="back-ic">←</div><div><div class="b-title">Agente YouTube</div><div class="b-sub">UNIPROVEEDORES · AGENCIA</div></div></a>
  <div class="ia-badge">▶️ IA Gemini 2.5</div>
</div>

<div class="main">
  <div class="tip">▶️ Generá el guion para el avatar IA + títulos, descripción y hashtags de tu Short en segundos. Pegás el guion en HeyGen y subís a YouTube.</div>

  <div class="card">
    <span class="sec-lbl">Producto del video</span>
    <div class="field"><label>Nombre del producto *</label><input id="p-name" type="text" placeholder="Ej: Mini compresor de aire recargable"></div>
    <div class="field"><label>Precio (ARS)</label><input id="p-price" type="number" placeholder="Ej: 73140"></div>
    <div class="field"><label>Diferencial / gancho</label><input id="p-diff" type="text" placeholder="Ej: recargable, entra en la guantera, se apaga solo"></div>
    <div class="field"><label>Link de compra (Mercado Libre)</label><input id="p-link" type="text" placeholder="https://articulo.mercadolibre.com.ar/MLA-..."></div>
    <div class="field"><label>Público objetivo</label><input id="p-target" type="text" placeholder="Ej: automovilistas, ciclistas, quien no quiere quedarse tirado"></div>
  </div>

  <button class="btn-main" id="gen-btn" onclick="generate()">▶️ Generar guion + textos del Short</button>

  <div id="results" style="margin-top:18px;">
    <div class="empty"><div style="font-size:28px;margin-bottom:8px">▶️</div><div style="font-size:13px;color:#666">Cargá el producto y generá el guion para tu avatar</div></div>
  </div>
</div>

<script>
let nT;
function notify(m){const e=document.getElementById('notif');e.textContent=m;e.style.display='block';clearTimeout(nT);nT=setTimeout(()=>e.style.display='none',4000);}

function logActivity(text){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    s.activity = s.activity || [];
    s.activity.unshift({icon:'▶️',agent:'YOUTUBE',text,time:new Date().toLocaleString('es-AR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})});
    s.activity = s.activity.slice(0,20);
    s.channels = s.channels || {};
    s.channels.yt = s.channels.yt || 'active';
    localStorage.setItem('up_state', JSON.stringify(s));
  } catch(e){}
}

function copyText(id,btn){
  const el=document.getElementById(id);
  const txt=el.textContent;
  navigator.clipboard.writeText(txt).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);});
  btn.textContent='✓ Copiado';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='📋 Copiar';btn.classList.remove('ok');},2000);
}
const esc = s => (s||'').replace(/</g,'&lt;');

async function generate(){
  const name = document.getElementById('p-name').value.trim();
  if(!name){ notify('Falta el nombre del producto'); return; }
  const price = document.getElementById('p-price').value;
  const diff = document.getElementById('p-diff').value.trim();
  const link = document.getElementById('p-link').value.trim();
  const target = document.getElementById('p-target').value.trim();

  const btn = document.getElementById('gen-btn');
  const res = document.getElementById('results');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando guion...';
  res.innerHTML = '<div class="loading"><span class="spinner"></span>Escribiendo el guion y los textos del Short...</div>';

  try {
    const r = await fetch('/api/agent',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({agent:'youtube',input:{name,price,diff,link,target}})
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    const out = d.output || {};
    const hashtags = (out.hashtags||[]).join(' ');
    const descFull = (out.description||'') + (hashtags?('\n\n'+hashtags):'');

    res.innerHTML = `
      <div class="result-card">
        <div class="result-title">🎙️ Guion para el avatar (HeyGen) <button class="btn-sm" onclick="copyText('r-guion',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-guion">${esc(out.guion)}</div>
        <div class="steps" style="margin-top:8px;">Pegalo en tu avatar → <b>Añadir un guion</b> → voz Español → 9:16 → Generar.</div>
      </div>

      <div class="result-card">
        <div class="result-title">🏷️ Títulos (elegí 1)</div>
        ${(out.titles||[]).map((t,i)=>`<div class="title-opt"><span id="r-title-${i}">${esc(t)}</span><span class="cc">${(t||'').length}/60</span><button class="btn-sm" onclick="copyText('r-title-'+${i},this)">📋</button></div>`).join('')}
      </div>

      <div class="result-card">
        <div class="result-title">📝 Descripción + hashtags <button class="btn-sm" onclick="copyText('r-desc',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-desc">${esc(descFull)}</div>
      </div>

      <div class="result-card">
        <div class="result-title">📌 Comentario para fijar <button class="btn-sm" onclick="copyText('r-comment',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-comment">${esc(out.comment)}</div>
      </div>

      <div class="result-card">
        <div class="result-title">💬 Subtítulos por línea (para CapCut manual) <button class="btn-sm" onclick="copyText('r-caps',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-caps">${esc((out.captions||[]).map((c,i)=>(i+1)+'. '+c).join('\n'))}</div>
      </div>`;

    saveOutput(out);
    logActivity('Guion YouTube: '+name.substring(0,40));
    notify('✅ Guion listo. Pegalo en HeyGen');
  } catch(e){
    res.innerHTML = '<div style="background:rgba(255,80,80,0.08);border:1px solid rgba(255,80,80,0.25);border-radius:12px;padding:18px;color:#ff8080;font-size:13px;text-align:center">❌ '+e.message+'</div>';
  }
  btn.disabled = false; btn.innerHTML = '▶️ Generar guion + textos del Short';
}

function loadProduct(){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    const p = s.product;
    if(!p) return;
    document.getElementById('p-name').value = p.name||'';
    document.getElementById('p-price').value = p.price||'';
    if(p.description) document.getElementById('p-diff').value = p.description.substring(0,120);
    notify('📦 Producto activo cargado');
  } catch(e){}
}

function saveOutput(out){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    s.outputs = s.outputs || {};
    s.outputs.youtube = {...out, generatedAt: new Date().toISOString()};
    localStorage.setItem('up_state', JSON.stringify(s));
  } catch(e){}
}

loadProduct();
</script>
</body>
</html>
