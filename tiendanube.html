<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Tienda Nube · Uniproveedores</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a16;color:#e0d8cc;min-height:100vh;}
.header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(0,179,230,0.18);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.back{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.back-ic{width:32px;height:32px;border-radius:8px;background:rgba(0,179,230,0.15);display:flex;align-items:center;justify-content:center;color:#00b3e6;font-size:18px;}
.b-title{font-size:15px;font-weight:700;color:#00b3e6;}
.b-sub{font-size:9px;color:#666;letter-spacing:2px;text-transform:uppercase;}
.ia-badge{font-size:11px;color:#00b3e6;background:rgba(0,179,230,0.08);border:1px solid rgba(0,179,230,0.2);padding:4px 10px;border-radius:20px;}
.main{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
.tip{background:rgba(0,179,230,0.06);border:1px solid rgba(0,179,230,0.15);border-radius:10px;padding:11px 16px;font-size:12px;color:#7ad0ee;margin-bottom:16px;}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:12px;}
.sec-lbl{font-size:10px;color:#00b3e6;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:10px;}
.field{margin-bottom:11px;}.field:last-child{margin-bottom:0;}
.field label{font-size:11px;color:#888;display:block;margin-bottom:5px;}
input,textarea,select{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:9px 12px;color:#e0d8cc;font-size:13px;font-family:inherit;}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(0,179,230,0.5);}
textarea{resize:vertical;min-height:60px;}
.btn-main{width:100%;background:linear-gradient(135deg,#00b3e6,#0090b8);border:none;border-radius:10px;padding:14px;color:white;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-main:hover{opacity:0.9;}.btn-main:disabled{background:rgba(100,100,100,0.2);color:#555;cursor:not-allowed;}
.result-card{background:rgba(255,255,255,0.03);border:1px solid rgba(0,179,230,0.2);border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #00b3e6;animation:fadeIn 0.35s ease;}
.result-title{font-size:13px;font-weight:700;color:#00b3e6;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.result-body{background:rgba(0,0,0,0.25);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:#d0c8b8;white-space:pre-wrap;}
.btn-sm{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11px;color:#aaa;font-family:inherit;}
.btn-sm:hover{background:rgba(255,255,255,0.12);}.btn-sm.ok{background:rgba(0,200,100,0.1);border-color:rgba(0,200,100,0.3);color:#00c864;}
.char-count{font-size:10px;color:#666;float:right;}
.char-count.over{color:#ff5555;}
.empty{text-align:center;padding:30px 20px;color:#444;}
.loading{text-align:center;padding:30px 20px;color:#00b3e6;font-size:13px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.15);border-top-color:#00b3e6;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
#notif{position:fixed;top:16px;right:16px;z-index:9999;background:rgba(10,10,22,0.97);border:1px solid rgba(0,179,230,0.45);border-radius:10px;padding:11px 16px;font-size:13px;color:#00b3e6;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div id="notif"></div>
<div class="header">
  <a class="back" href="/"><div class="back-ic">←</div><div><div class="b-title">Agente Tienda Nube</div><div class="b-sub">UNIPROVEEDORES · AGENCIA</div></div></a>
  <div class="ia-badge">🏪 IA Gemini 2.5</div>
</div>

<div class="main">
  <div class="tip">🏪 Genera fichas SEO completas para Tienda Nube: meta-título, meta-descripción, slug, etiquetas, descripción HTML con bullets y tips de conversión.</div>

  <div class="card">
    <span class="sec-lbl">Producto en Tienda Nube</span>
    <div class="field"><label>Nombre del producto *</label><input id="p-name" type="text" placeholder="Ej: Parches Detox para Pies"></div>
    <div class="field"><label>Precio (ARS)</label><input id="p-price" type="number" placeholder="Ej: 7900"></div>
    <div class="field"><label>Categoría</label><input id="p-cat" type="text" placeholder="Ej: Salud y Bienestar"></div>
    <div class="field"><label>Beneficios y características clave</label><textarea id="p-desc" placeholder="Material, modo de uso, qué incluye, beneficios, contraindicaciones, garantía…"></textarea></div>
    <div class="field"><label>Público objetivo</label><input id="p-target" type="text" placeholder="Ej: Mujeres 35-65 con problemas circulatorios"></div>
  </div>

  <button class="btn-main" id="gen-btn" onclick="generate()">✨ Generar ficha SEO con IA</button>

  <div id="results" style="margin-top:18px;">
    <div class="empty"><div style="font-size:28px;margin-bottom:8px">🏪</div><div style="font-size:13px;color:#666">Completá los datos y armá tu ficha optimizada</div></div>
  </div>
</div>

<script>
let nT;
function notify(m){const e=document.getElementById('notif');e.textContent=m;e.style.display='block';clearTimeout(nT);nT=setTimeout(()=>e.style.display='none',4000);}

function logActivity(text){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    s.activity = s.activity || [];
    s.activity.unshift({icon:'🏪',agent:'TN',text,time:new Date().toLocaleString('es-AR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})});
    s.activity = s.activity.slice(0,20);
    s.channels = s.channels || {};
    s.channels.tn = s.channels.tn || 'active';
    localStorage.setItem('up_state', JSON.stringify(s));
  } catch(e){}
}

function copyText(id,btn){
  const el=document.getElementById(id);
  const txt=el.textContent;
  navigator.clipboard.writeText(txt).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);});
  btn.textContent='✓ Copiado';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='📋 Copiar';btn.classList.remove('ok');},2000);
}

function loadProduct(){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    const p = s.product;
    if(!p) return;
    document.getElementById('p-name').value = p.name||'';
    document.getElementById('p-price').value = p.price||'';
    document.getElementById('p-cat').value = p.category||'';
    document.getElementById('p-desc').value = p.description||'';
    document.getElementById('p-target').value = p.target||'';
    notify('📦 Producto activo cargado');
  } catch(e){}
}

function saveOutput(out){
  try {
    const s = JSON.parse(localStorage.getItem('up_state')||'{}');
    s.outputs = s.outputs || {};
    s.outputs.tn = {...out, generatedAt: new Date().toISOString()};
    localStorage.setItem('up_state', JSON.stringify(s));
  } catch(e){}
}

async function generate(){
  const name = document.getElementById('p-name').value.trim();
  if(!name){ notify('Falta el nombre del producto'); return; }
  const cat = document.getElementById('p-cat').value.trim();
  const price = document.getElementById('p-price').value;
  const desc = document.getElementById('p-desc').value.trim();
  const target = document.getElementById('p-target').value.trim();

  const btn = document.getElementById('gen-btn');
  const res = document.getElementById('results');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando ficha SEO...';
  res.innerHTML = '<div class="loading"><span class="spinner"></span>Optimizando ficha para Tienda Nube...</div>';

  try {
    const r = await fetch('/api/agent',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({agent:'tiendanube',input:{name,cat,price,desc,target}})
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    const out = d.output || {};

    res.innerHTML = `
      <div class="result-card">
        <div class="result-title">Meta título (Google) <span class="char-count ${(out.metaTitle||'').length>60?'over':''}">${(out.metaTitle||'').length}/60</span></div>
        <div class="result-body" id="r-metat">${(out.metaTitle||'').replace(/</g,'&lt;')}</div>
        <button class="btn-sm" style="margin-top:8px;" onclick="copyText('r-metat',this)">📋 Copiar</button>
      </div>
      <div class="result-card">
        <div class="result-title">Meta descripción <span class="char-count ${(out.metaDesc||'').length>160?'over':''}">${(out.metaDesc||'').length}/160</span></div>
        <div class="result-body" id="r-metad">${(out.metaDesc||'').replace(/</g,'&lt;')}</div>
        <button class="btn-sm" style="margin-top:8px;" onclick="copyText('r-metad',this)">📋 Copiar</button>
      </div>
      <div class="result-card">
        <div class="result-title">Slug (URL amigable) <button class="btn-sm" onclick="copyText('r-slug',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-slug">${(out.slug||'').replace(/</g,'&lt;')}</div>
      </div>
      <div class="result-card">
        <div class="result-title">Etiquetas / tags <button class="btn-sm" onclick="copyText('r-tags',this)">📋 Copiar</button></div>
        <div class="result-body" id="r-tags">${(out.tags||[]).join(', ').replace(/</g,'&lt;')}</div>
      </div>
      <div class="result-card">
        <div class="result-title">Descripción HTML (pegar en editor TN) <button class="btn-sm" onclick="copyText('r-html',this)">📋 Copiar HTML</button></div>
        <div class="result-body" id="r-html">${(out.htmlDescription||'').replace(/</g,'&lt;')}</div>
      </div>
      <div class="result-card">
        <div class="result-title">💡 Tips conversión y pixel</div>
        <div class="result-body">${(out.tips||'').replace(/</g,'&lt;')}</div>
      </div>`;

    saveOutput(out);
    logActivity('Ficha SEO generada: '+name.substring(0,40));
    notify('✅ Ficha lista. Copiala a tu admin de Tienda Nube');
  } catch(e){
    res.innerHTML = '<div style="background:rgba(255,80,80,0.08);border:1px solid rgba(255,80,80,0.25);border-radius:12px;padding:18px;color:#ff8080;font-size:13px;text-align:center">❌ '+e.message+'</div>';
  }
  btn.disabled = false; btn.innerHTML = '✨ Generar ficha SEO con IA';
}

loadProduct();
</script>
</body>
</html>
