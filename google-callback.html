<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando Google Contactos…</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a16;color:#e0d8cc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:560px;width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(66,133,244,0.3);border-radius:16px;padding:32px;text-align:center;}
.icon{font-size:48px;margin-bottom:14px;}
h1{font-size:18px;color:#7eb0ff;margin-bottom:10px;font-weight:700;}
p{font-size:13px;color:#999;line-height:1.6;margin-bottom:8px;}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(66,133,244,0.2);border-top-color:#7eb0ff;border-radius:50%;animation:spin 0.8s linear infinite;margin:14px 0;}
@keyframes spin{to{transform:rotate(360deg);}}
.ok{color:#00c864;border-color:rgba(0,200,100,0.3) !important;}
.err{color:#ff8080;border-color:rgba(255,80,80,0.3) !important;}
.env{background:rgba(0,0,0,0.35);padding:12px;border-radius:8px;font-family:'SF Mono',Menlo,monospace;font-size:11px;color:#9fe0b6;margin-top:12px;text-align:left;white-space:pre-wrap;word-break:break-all;border:1px solid rgba(0,200,100,0.2);}
.btn{display:inline-block;margin-top:14px;background:linear-gradient(135deg,#4285f4,#2a63c9);color:#fff;padding:10px 18px;border:none;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;}
.btn2{display:inline-block;margin:14px 6px 0;background:rgba(255,255,255,0.08);color:#ccc;padding:10px 18px;border-radius:8px;text-decoration:none;font-size:13px;}
.hint{font-size:11px;color:#888;margin-top:10px;line-height:1.6;text-align:left;}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="icon" id="icon">📇</div>
  <h1 id="title">Conectando con Google Contactos…</h1>
  <p id="msg">Procesando autorización</p>
  <div class="spinner" id="spin"></div>
  <div id="extra"></div>
</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const err = params.get('error');

  const set = (icon, title, msg, cls) => {
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg;
    if (cls) document.getElementById('box').classList.add(cls);
    document.getElementById('spin').style.display = 'none';
  };
  const back = '<a class="btn2" href="/conexiones">← Volver a Conexiones</a>';

  if (err) { set('❌', 'Autorización cancelada', err, 'err'); document.getElementById('extra').innerHTML = back; return; }
  if (!code) { set('⚠️', 'Falta el código', 'No llegó ?code= desde Google.', 'err'); document.getElementById('extra').innerHTML = back; return; }

  let s = {};
  try { s = JSON.parse(localStorage.getItem('up_state')||'{}'); } catch(e){}
  const creds = s.connections?.google || {};
  const { clientId, clientSecret } = creds;
  if (!clientId || !clientSecret) {
    set('⚠️', 'Faltan Client ID / Client Secret', 'Volvé a Conexiones, pegá los datos de Google y reautorizá.', 'err');
    document.getElementById('extra').innerHTML = back; return;
  }

  const redirectUri = location.origin + '/google-callback';
  try {
    const r = await fetch('/api/google/exchange', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ clientId, clientSecret, code, redirectUri })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Falló el intercambio');

    // Guardamos para referencia, y mostramos el bloque .env para pegar en el servidor.
    s.connections = s.connections || {};
    s.connections.google = { ...creds, refreshToken: d.refreshToken, authorizedAt: new Date().toISOString() };
    localStorage.setItem('up_state', JSON.stringify(s));

    const envBlock =
      'GOOGLE_CONTACTS_CLIENT_ID=' + clientId + '\n' +
      'GOOGLE_CONTACTS_CLIENT_SECRET=' + clientSecret + '\n' +
      'GOOGLE_CONTACTS_REFRESH_TOKEN=' + d.refreshToken;

    set('✅', '¡Google autorizado!', 'Copiá estas 3 líneas y pegámelas por el chat, o cargalas en el .env del servidor.', 'ok');
    document.getElementById('extra').innerHTML =
      '<div class="env" id="env">' + envBlock.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>' +
      '<button class="btn" onclick="(function(){navigator.clipboard.writeText(document.getElementById(\'env\').innerText);this.textContent=\'✅ Copiado\';}).call(this)">📋 Copiar las 3 líneas</button>' +
      back +
      '<div class="hint">⚠️ El <b>refresh_token</b> es secreto: no lo compartas en público. Va en el archivo <b>.env</b> del bot (servidor), no en Vercel.</div>';
  } catch(e) {
    set('❌', 'Error al conectar', e.message, 'err');
    document.getElementById('extra').innerHTML = back;
  }
})();
</script>
</body>
</html>
